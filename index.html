<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPI IPAS Kelas V — Sifat-Sifat Cahaya</title>
<style>
:root{--blue:#174a7e;--blue2:#236ca8;--sky:#eaf5ff;--gold:#ffc94a;--ink:#18324b;--muted:#61758a;--green:#dff7e7;--red:#ffe7e7;--line:#d6e2ee;--paper:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f7fb;color:var(--ink);line-height:1.5}
button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:#e8f1fa;color:var(--blue)}button:hover{filter:brightness(.97)}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f6b925;outline-offset:2px}.primary{background:var(--blue);color:white}.gold{background:var(--gold);color:#302a13}.quiet{background:transparent;border:1px solid var(--line)}button:disabled{opacity:.4;cursor:not-allowed}
header{background:linear-gradient(125deg,#123b67,#2779b9);color:#fff;padding:16px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}.brand-icon{font-size:34px;background:#ffffff20;border-radius:14px;padding:8px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;margin:3px 0 0;color:#dbeeff}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions button{background:#ffffff1f;color:white;border:1px solid #ffffff40;padding:8px 11px}
main{max-width:1100px;margin:22px auto;padding:0 16px 35px}.nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 15px}.nav button{white-space:nowrap;background:white;border:1px solid var(--line)}.nav button.active{background:var(--blue);color:white}
.hero{border-radius:24px;padding:clamp(22px,5vw,45px);color:white;background:linear-gradient(125deg,#143e6b,#2478b6);position:relative;overflow:hidden}.hero:after{content:"☼";font-size:210px;color:#ffffff12;position:absolute;right:18px;top:-50px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#cde8ff;font-weight:800}.hero h2{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:10px 0}.hero p{max-width:650px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hero .gold{position:relative;z-index:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 5px 20px #173f6510}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.topic{border:1px solid var(--line);border-radius:16px;padding:16px;background:white;display:flex;flex-direction:column;gap:8px;min-height:190px}.topic .emoji{font-size:38px}.topic h3{margin:0;font-size:18px}.topic p{margin:0;color:var(--muted);font-size:14px;flex:1}.topic button{align-self:flex-start}.muted{color:var(--muted)}h2{font-size:27px;line-height:1.2;margin:0 0 12px}h3{margin:0 0 8px}p{margin-top:7px}.pill{display:inline-block;background:var(--sky);color:var(--blue);font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px}
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.visual{background:linear-gradient(145deg,#eff8ff,#dceeff);border-radius:16px;padding:14px;min-height:230px;display:flex;align-items:center;justify-content:center}.visual svg{width:100%;max-height:270px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.note{background:#f5f9fd;border-left:4px solid var(--gold);padding:12px 14px;border-radius:8px;margin-top:12px}.feedback{padding:12px;border-radius:10px;margin-top:12px}.good{background:var(--green)}.bad{background:var(--red)}.progress{height:8px;background:#e2eaf2;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#2c9b62;width:0;transition:width .2s}.question{border-top:1px solid var(--line);padding:18px 0}.option{display:block;width:100%;text-align:left;margin-top:8px;background:#f5f8fc;border:1px solid var(--line);font-weight:500}.option.selected{border:2px solid var(--blue);background:#e7f2ff}.option.correct{background:var(--green);border-color:#36a568}.option.incorrect{background:var(--red);border-color:#dc6c6c}.stat{background:#f5f9fd;padding:15px;border-radius:14px}.stat strong{font-size:28px;display:block}.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px}
label{display:block;font-weight:700;margin-bottom:6px}select,textarea,input[type=text]{border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;background:white;color:var(--ink)}textarea{resize:vertical}.small{font-size:13px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}
@media(max-width:720px){.two{grid-template-columns:1fr}.brand h1{font-size:16px}.hero:after{font-size:150px;right:-10px}.card{padding:16px}header{padding:14px}.nav{margin-right:-5px}}
@media print{header,.nav,.controls,.hero-actions,button{display:none!important}body{background:white}.card{box-shadow:none;break-inside:avoid}main{max-width:none;margin:0}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="brand-icon">🔦</div><div><h1>MPI IPAS • SIFAT-SIFAT CAHAYA</h1><p>Kelas V / Fase C · SD Negeri 5 Pakue Utara</p></div></div>
 <div class="top-actions"><button id="soundBtn" aria-pressed="false" title="Aktifkan atau nonaktifkan suara">🔈 Suara: Mati</button><button onclick="window.print()">🖨️ Cetak</button></div>
</header>
<main>
 <nav class="nav" aria-label="Navigasi utama">
  <button data-page="home" class="active">🏠 Beranda</button><button data-page="guide">📖 Petunjuk</button><button data-page="materials">🔎 Materi</button><button data-page="lab">🧪 Laboratorium</button><button data-page="quiz">⭐ Kuis</button><button data-page="reflection">💭 Refleksi</button>
 </nav>
 <div id="app" aria-live="polite"></div>
 <div class="footer">Media Pembelajaran Interaktif • IPAS Kelas V • Belajar, mencoba, dan menemukan!</div>
</main>
<script>
const app=document.getElementById('app');
const topics=[
 {title:'Cahaya merambat lurus',emoji:'🔦',short:'Berkas senter',explain:'Cahaya merambat lurus ketika melewati medium yang seragam.',example:'Berkas senter tampak lurus ketika diarahkan ke tempat gelap.',try:'Arahkan senter melalui tiga karton berlubang. Cahaya dapat lewat jika lubang-lubang berada pada satu garis.',question:'Dalam percobaan tiga karton, kapan cahaya senter dapat terlihat melewati semua lubang?',options:['Ketika semua lubang segaris','Ketika karton ditumpuk menutup lubang','Ketika lubang berada di arah berbeda'],correct:0,why:'Cahaya merambat lurus, sehingga lubang perlu berada pada satu garis.'},
 {title:'Cahaya dapat dipantulkan',emoji:'🪞',short:'Cermin datar',explain:'Pemantulan terjadi ketika cahaya mengenai permukaan lalu kembali ke medium asalnya.',example:'Kita dapat melihat wajah di cermin karena cahaya dari wajah dipantulkan menuju mata.',try:'Sorotkan senter ke cermin datar dan amati arah pantulan pada dinding. Jangan arahkan pantulan ke mata.',question:'Mengapa kita dapat melihat wajah pada cermin?',options:['Cermin menghasilkan wajah baru','Cahaya dari wajah dipantulkan oleh cermin','Cahaya berubah menjadi suara'],correct:1,why:'Cermin memantulkan cahaya dari wajah menuju mata kita.'},
 {title:'Cahaya dapat dibiaskan',emoji:'🥛',short:'Pensil dalam air',explain:'Pembiasan adalah perubahan arah rambat cahaya ketika melewati dua medium berbeda, misalnya udara dan air.',example:'Pensil di dalam gelas berisi air tampak bengkok atau bergeser.',try:'Masukkan pensil ke gelas bening berisi air. Amati dari samping dan bandingkan dengan pensil di luar air.',question:'Pensil dalam air tampak bengkok karena cahaya mengalami ...',options:['Pemantulan saja','Pembiasan','Penguraian menjadi warna'],correct:1,why:'Cahaya berubah arah saat melewati batas antara air dan udara.'},
 {title:'Cahaya menembus benda bening',emoji:'🪟',short:'Bahan transparan',explain:'Cahaya dapat melewati benda transparan, seperti kaca bening. Benda translusen meneruskan sebagian cahaya sehingga objek terlihat samar, sedangkan benda opak menghalangi cahaya.',example:'Benda di balik kaca bening terlihat jelas; di balik kertas minyak tampak samar.',try:'Bandingkan kaca/plastik bening, kertas minyak, dan karton di depan benda. Amati seberapa jelas benda terlihat.',question:'Benda yang meneruskan cahaya sehingga benda di belakangnya terlihat jelas disebut ...',options:['Transparan','Translusen','Opak'],correct:0,why:'Bahan transparan meneruskan cahaya dengan baik sehingga benda di belakangnya terlihat jelas.'},
 {title:'Cahaya dapat diuraikan',emoji:'🌈',short:'Prisma dan pelangi',explain:'Cahaya putih dapat diuraikan menjadi berbagai warna. Prisma dapat memisahkan warna-warna penyusun cahaya putih.',example:'Pelangi muncul ketika cahaya matahari berinteraksi dengan tetesan air di atmosfer.',try:'Jika tersedia, amati cahaya yang melewati prisma dengan arahan guru. Jangan melihat langsung ke Matahari.',question:'Fenomena pelangi berkaitan dengan cahaya yang ...',options:['Diuraikan menjadi berbagai warna','Berubah menjadi bunyi','Tidak dapat melewati air'],correct:0,why:'Tetesan air dapat membiaskan dan menguraikan cahaya Matahari menjadi warna-warna.'},
 {title:'Cahaya membentuk bayangan',emoji:'🌑',short:'Benda menghalangi cahaya',explain:'Bayangan terbentuk ketika benda menghalangi jalannya cahaya menuju permukaan di belakang benda.',example:'Bayangan tubuh terlihat ketika cahaya Matahari atau lampu terhalang tubuh.',try:'Letakkan benda di antara senter dan dinding. Ubah jarak benda terhadap senter dan amati perubahan bayangan.',question:'Bayangan terbentuk ketika ...',options:['Cahaya melewati semua benda tanpa hambatan','Benda menghalangi cahaya menuju permukaan','Cahaya tidak memiliki sumber'],correct:1,why:'Daerah yang tidak menerima cahaya karena terhalang benda tampak sebagai bayangan.'}
];
const questions=[
 {q:'Cahaya senter yang melewati tiga lubang karton segaris membuktikan bahwa cahaya ...',opts:['Merambat lurus','Selalu melengkung','Tidak dapat bergerak'],a:0,topic:0},
 {q:'Peristiwa yang menunjukkan pemantulan cahaya adalah ...',opts:['Pensil tampak bengkok di air','Melihat wajah pada cermin','Melihat benda melalui kaca bening'],a:1,topic:1},
 {q:'Sedotan dalam gelas berisi air tampak bengkok karena ...',opts:['Cahaya dibiaskan','Cahaya menjadi suara','Cahaya terhenti seluruhnya'],a:0,topic:2},
 {q:'Benda transparan memiliki sifat ...',opts:['Menghalangi semua cahaya','Meneruskan cahaya sehingga objek terlihat jelas','Selalu menghasilkan pelangi'],a:1,topic:3},
 {q:'Prisma dapat memisahkan cahaya putih menjadi ...',opts:['Berbagai warna','Gelombang suara','Bayangan hitam saja'],a:0,topic:4},
 {q:'Benda yang menghalangi cahaya dapat menghasilkan ...',opts:['Bayangan','Suara','Air'],a:0,topic:5},
 {q:'Kertas minyak biasanya tergolong bahan ...',opts:['Transparan','Translusen','Opak sepenuhnya'],a:1,topic:3},
 {q:'Saat mengubah jarak benda dari senter dan mengamati bayangan, kita sedang ...',opts:['Melakukan pengamatan/percobaan','Menghafal tanpa bukti','Mengubah cahaya menjadi benda'],a:0,topic:5}
];
let page='home',topicIndex=0,completed=[false,false,false,false,false,false],sound=false;
let labStep=0,labSetting=0,quizAnswers=Array(questions.length).fill(null),quizSubmitted=false;
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'});}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function svgFor(i,setting=0){
const common='stroke-linecap="round" stroke-linejoin="round"';
if(i===0)return `<svg viewBox="0 0 360 190" role="img" aria-label="Senter mengirim cahaya lurus melalui lubang karton"><rect x="65" y="32" width="12" height="122" rx="3" fill="#9fb2c5"/><rect x="165" y="32" width="12" height="122" rx="3" fill="#9fb2c5"/><rect x="265" y="32" width="12" height="122" rx="3" fill="#9fb2c5"/><circle cx="26" cy="92" r="15" fill="#f9b92f"/><path d="M40 92 L318 ${setting===1?65:92}" stroke="#f5ad18" stroke-width="5" ${common}/><circle cx="318" cy="${setting===1?65:92}" r="5" fill="#f5ad18"/><text x="180" y="178" text-anchor="middle" font-size="12" fill="#315574">Lubang segaris → cahaya lewat</text></svg>`;
if(i===1)return `<svg viewBox="0 0 360 190" role="img" aria-label="Sinar datang dipantulkan oleh cermin"><path d="M178 24 L178 155" stroke="#71869a" stroke-width="9"/><path d="M35 30 L178 90" stroke="#f5ad18" stroke-width="5" ${common}/><path d="M178 90 L320 30" stroke="#e65d43" stroke-width="5" ${common}/><path d="M178 25 V158" stroke="#71869a" stroke-dasharray="5 5" opacity=".4"/><text x="80" y="20" font-size="12" fill="#315574">Sinar datang</text><text x="230" y="20" font-size="12" fill="#315574">Sinar pantul</text></svg>`;
if(i===2)return `<svg viewBox="0 0 360 190" role="img" aria-label="Pensil tampak bergeser ketika berada dalam air"><path d="M60 55 H300 V160 H60Z" fill="#8fd0f4" opacity=".55" stroke="#378ac1" stroke-width="3"/><path d="M60 55 H300" stroke="#378ac1" stroke-width="3"/><path d="M130 18 L210 80 L268 150" stroke="#d69a43" stroke-width="12" ${common}/><path d="M130 18 L210 80" stroke="#f4c36e" stroke-width="4"/><text x="180" y="181" text-anchor="middle" font-size="12" fill="#315574">Arah tampak berubah di batas air–udara</text></svg>`;
if(i===3)return `<svg viewBox="0 0 360 190" role="img" aria-label="Perbandingan bahan transparan, translusen, dan opak"><path d="M12 93 H348" stroke="#f5ad18" stroke-width="5"/><rect x="98" y="42" width="42" height="100" rx="4" fill="#7dd3fc" opacity=".45" stroke="#2383bb" stroke-width="2"/><rect x="159" y="42" width="42" height="100" rx="4" fill="#cbd5e1" opacity=".9" stroke="#64748b" stroke-width="2"/><rect x="220" y="42" width="42" height="100" rx="4" fill="#334155" stroke="#334155" stroke-width="2"/><text x="119" y="160" text-anchor="middle" font-size="10" fill="#315574">Bening</text><text x="180" y="160" text-anchor="middle" font-size="10" fill="#315574">Samar</text><text x="241" y="160" text-anchor="middle" font-size="10" fill="#315574">Opak</text></svg>`;
if(i===4)return `<svg viewBox="0 0 360 190" role="img" aria-label="Prisma menguraikan cahaya putih menjadi spektrum warna"><path d="M12 91 H115" stroke="#f5ad18" stroke-width="6"/><path d="M115 34 L177 91 L115 148Z" fill="#b9dfff" stroke="#4c91c4" stroke-width="3"/><path d="M177 91 L335 28 M177 91 L335 53 M177 91 L335 78 M177 91 L335 103 M177 91 L335 128 M177 91 L335 153" stroke-width="4" ${common} stroke="${setting%2?'#dc4e4e':'#f5ad18'}"/><text x="145" y="174" text-anchor="middle" font-size="12" fill="#315574">Prisma</text></svg>`;
return `<svg viewBox="0 0 360 190" role="img" aria-label="Benda menghalangi cahaya senter sehingga terbentuk bayangan"><circle cx="28" cy="90" r="15" fill="#f9b92f"/><path d="M42 90 H125" stroke="#f5ad18" stroke-width="5"/><rect x="125" y="55" width="45" height="70" rx="5" fill="#40576d"/><path d="M170 55 L325 22 L325 158 L170 125Z" fill="#64748b" opacity=".22"/><path d="M170 55 L325 22 M170 125 L325 158" stroke="#e4a51a" stroke-width="2" stroke-dasharray="5 5"/><text x="250" y="178" text-anchor="middle" font-size="12" fill="#315574">Daerah gelap = bayangan</text></svg>`;
}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function render(){
if(page==='home'){app.innerHTML=`<section class="hero"><div class="eyebrow">IPAS • KELAS V • FASE C</div><h2>Petualangan<br>Ilmuwan Cilik</h2><p>Yuk, temukan rahasia cahaya! Pelajari enam sifat cahaya melalui contoh sehari-hari, simulasi sederhana, dan kuis interaktif.</p><div class="hero-actions"><button class="gold" onclick="go('materials')">Mulai Belajar →</button><button onclick="go('guide')">Lihat Petunjuk</button></div></section>
<section class="card"><div class="toolbar"><div><h2>Jalur Petualangan</h2><p class="muted">Selesaikan materi, coba laboratorium, lalu uji pemahamanmu.</p></div><div class="stat"><strong>${completed.filter(Boolean).length}/6</strong><span class="small">Materi dipelajari</span></div></div><div class="progress"><span style="width:${completed.filter(Boolean).length/6*100}%"></span></div></section>
<div class="grid" style="margin-top:16px"><article class="topic"><div class="emoji">📘</div><h3>Kenali Sifat Cahaya</h3><p>Enam materi dengan ilustrasi dan contoh di sekitar kita.</p><button onclick="go('materials')">Buka Materi</button></article><article class="topic"><div class="emoji">🧪</div><h3>Laboratorium Cahaya</h3><p>Amati jalannya cahaya dan ubah kondisi simulasi.</p><button onclick="go('lab')">Mulai Percobaan</button></article><article class="topic"><div class="emoji">⭐</div><h3>Kuis Ilmuwan Cilik</h3><p>Delapan pertanyaan untuk memeriksa pemahaman.</p><button onclick="go('quiz')">Kerjakan Kuis</button></article></div>
<section class="card"><h3>🎯 Tujuan pembelajaran</h3><ul><li>Menjelaskan sifat-sifat cahaya dengan kata-kata sendiri.</li><li>Memberi contoh sifat cahaya dalam kehidupan sehari-hari.</li><li>Mengamati percobaan sederhana dan menyampaikan kesimpulan.</li></ul></section>`}
else if(page==='guide'){app.innerHTML=card('📖 Petunjuk Penggunaan',`<p>Gunakan menu di bagian atas untuk berpindah halaman. Kamu boleh kembali membuka materi kapan saja.</p><div class="grid"><div class="stat"><strong>1</strong>Baca dan amati enam materi.</div><div class="stat"><strong>2</strong>Pilih topik di laboratorium dan ubah pengaturannya.</div><div class="stat"><strong>3</strong>Kerjakan kuis. Pilihan jawaban dapat diubah sebelum kuis dikumpulkan.</div><div class="stat"><strong>4</strong>Baca umpan balik dan isi refleksi.</div></div><div class="note"><b>Ingat keselamatan:</b> jangan arahkan cahaya senter atau pantulan cermin ke mata. Jangan melihat langsung ke Matahari. Lakukan percobaan dengan arahan guru.</div><div class="controls"><button class="primary" onclick="go('materials')">Saya Mengerti →</button><button onclick="go('home')">Kembali ke Beranda</button></div>`)}
else if(page==='materials'){app.innerHTML=`<section class="card"><span class="pill">PETA MATERI</span><h2 style="margin-top:10px">Jelajahi 6 Sifat Cahaya</h2><p class="muted">Pilih kartu untuk membaca penjelasan, contoh, dan ide percobaannya.</p><div class="grid">${topics.map((t,i)=>`<article class="topic"><div class="emoji">${t.emoji}</div><h3>${i+1}. ${t.title}</h3><p>${t.example}</p><button onclick="openTopic(${i})">${completed[i]?'Pelajari lagi':'Pelajari'} →</button></article>`).join('')}</div></section>`}
else if(page==='topic'){let t=topics[topicIndex];app.innerHTML=`<section class="card"><span class="pill">MATERI ${topicIndex+1} DARI 6</span><div class="two" style="margin-top:15px"><div><h2>${t.emoji} ${t.title}</h2><p>${t.explain}</p><div class="note"><b>Contoh sehari-hari</b><br>${t.example}</div><h3 style="margin-top:18px">🔍 Ayo menyelidiki!</h3><p>${t.try}</p><p class="muted small">Lakukan dengan bahan aman dan pendampingan guru.</p></div><div class="visual">${svgFor(topicIndex)}</div></div><div class="controls"><button onclick="go('materials')">← Peta Materi</button><button class="primary" onclick="openLab(${topicIndex})">Coba di Laboratorium →</button><button class="gold" onclick="markTopic(${topicIndex})">✓ Tandai Selesai</button></div><div class="toolbar" style="margin-top:18px"><button ${topicIndex===0?'disabled':''} onclick="openTopic(${topicIndex-1})">← Sebelumnya</button><span class="muted small">Topik ${topicIndex+1}/6</span><button ${topicIndex===5?'disabled':''} onclick="openTopic(${topicIndex+1})">Berikutnya →</button></div></section>`}
else if(page==='lab'){app.innerHTML=`<section class="card"><span class="pill">LABORATORIUM INTERAKTIF</span><h2 style="margin-top:10px">Ayo Mengamati Cahaya!</h2><p class="muted">Pilih sifat cahaya. Ubah kondisi pengamatan, lalu baca apa yang perlu diperhatikan.</p><div class="two"><div><label for="labTopic">Pilih percobaan</label><select id="labTopic" onchange="setLabTopic(this.value)">${topics.map((t,i)=>`<option value="${i}" ${topicIndex===i?'selected':''}>${i+1}. ${t.title}</option>`).join('')}</select><div class="visual" style="margin-top:12px">${svgFor(topicIndex,labStep)}</div></div><div><h3 id="labTitle">${topics[topicIndex].emoji} ${topics[topicIndex].title}</h3><p id="labText">${topics[topicIndex].try}</p><label for="setting">Ubah kondisi pengamatan</label><select id="setting" onchange="setLabSetting(this.value)"><option value="0">Kondisi awal</option><option value="1">Ubah posisi atau arah</option><option value="2">Bandingkan kondisi lain</option></select><div class="note" id="labResult">Amati gambar terlebih dahulu. Apa yang kamu perkirakan akan terjadi?</div><div class="controls"><button onclick="labObserve()">🔎 Tampilkan hasil pengamatan</button><button class="primary" onclick="labConclusion()">Tarik kesimpulan</button></div><div id="labFeedback"></div></div></div><div class="controls"><button onclick="go('materials')">← Kembali ke Materi</button><button class="gold" onclick="markTopic(${topicIndex});go('quiz')">Selesai, ke Kuis →</button></div></section>`}
else if(page==='quiz'){const done=quizAnswers.filter(x=>x!==null).length;app.innerHTML=`<section class="card"><span class="pill">EVALUASI</span><h2 style="margin-top:10px">Kuis Ilmuwan Cilik</h2><p>Pilih satu jawaban pada setiap soal. Kamu dapat mengubah jawaban sebelum menekan tombol kumpulkan.</p><div class="toolbar"><span><b>Progres:</b> ${done}/${questions.length} soal</span><span class="muted small">Nilai dihitung setelah dikumpulkan</span></div><div class="progress" style="margin-top:9px"><span style="width:${done/questions.length*100}%;background:#2678b8"></span></div>${questions.map((q,i)=>`<div class="question"><b>${i+1}. ${q.q}</b>${q.opts.map((o,j)=>`<button class="option ${quizAnswers[i]===j?'selected':''}" onclick="chooseAnswer(${i},${j})" ${quizSubmitted?'disabled':''}>${String.fromCharCode(65+j)}. ${o}</button>`).join('')}${quizSubmitted?`<div class="feedback ${quizAnswers[i]===q.a?'good':'bad'}">${quizAnswers[i]===q.a?'Benar!':'Belum tepat.'} ${q.why||topics[q.topic].explain}</div>`:''}</div>`).join('')}<div class="controls">${quizSubmitted?`<button class="primary" onclick="go('results')">Lihat Hasil →</button><button onclick="resetQuiz()">Ulangi Kuis</button>`:`<button class="primary" onclick="submitQuiz()">Kumpulkan Jawaban</button><button onclick="go('materials')">Belajar Lagi</button>`}</div><div id="quizMsg"></div></section>`}
else if(page==='results'){let correct=questions.filter((q,i)=>quizAnswers[i]===q.a).length;let score=Math.round(correct/questions.length*100);let weak=[...new Set(questions.filter((q,i)=>quizAnswers[i]!==q.a).map(q=>q.topic))];app.innerHTML=`<section class="card"><span class="pill">HASIL BELAJAR</span><h2 style="margin-top:10px">${score>=85?'Hebat, Ilmuwan Cilik!':score>=70?'Bagus, Terus Berlatih!':'Jangan Menyerah, Ayo Belajar Lagi!'}</h2><div class="grid" style="margin-top:16px"><div class="stat"><strong>${score}</strong>Nilai (0–100)</div><div class="stat"><strong>${correct}/${questions.length}</strong>Jawaban benar</div></div><div class="note">${score>=85?'Kamu sudah menunjukkan pemahaman yang sangat baik. Coba jelaskan satu sifat cahaya kepada temanmu.':score>=70?'Tinjau kembali konsep yang belum tepat, kemudian coba kuis lagi.':'Baca kembali materi dan gunakan laboratorium untuk membantu pengamatan. Kamu boleh mencoba lagi.'}</div>${weak.length?`<h3 style="margin-top:20px">Topik yang perlu ditinjau</h3><div class="grid">${weak.map(i=>`<article class="topic"><div class="emoji">${topics[i].emoji}</div><h3>${topics[i].title}</h3><p>${topics[i].explain}</p><button onclick="openTopic(${i})">Pelajari lagi</button></article>`).join('')}</div>`:'<p class="feedback good">Semua jawaban benar. Pertahankan rasa ingin tahumu!</p>'}<div class="controls"><button class="primary" onclick="go('reflection')">Lanjut Refleksi →</button><button onclick="resetQuiz()">Ulangi Kuis</button><button onclick="go('home')">Beranda</button></div></section>`}
else if(page==='reflection'){app.innerHTML=`<section class="card"><span class="pill">REFLEKSI DIRI</span><h2 style="margin-top:10px">Apa yang Kamu Temukan?</h2><p>Isi refleksi berikut dengan jujur. Jawabanmu membantu guru mengetahui pengalaman belajarmu.</p><form id="reflectionForm"><label for="r1">1. Sifat cahaya yang paling saya pahami adalah...</label><textarea id="r1" rows="2" placeholder="Tuliskan jawabanmu"></textarea><label for="r2" style="margin-top:14px">2. Percobaan yang paling menarik bagi saya adalah...</label><textarea id="r2" rows="2" placeholder="Tuliskan jawabanmu"></textarea><label for="r3" style="margin-top:14px">3. Pertanyaan yang masih ingin saya ketahui...</label><textarea id="r3" rows="2" placeholder="Tuliskan pertanyaanmu"></textarea><div class="controls"><button type="submit" class="primary">Simpan Refleksi</button><button type="button" onclick="go('home')">Kembali ke Beranda</button></div><div id="reflectMsg"></div></form><div class="note"><b>Tantangan di rumah:</b> dengan izin dan bantuan orang tua, temukan tiga contoh sifat cahaya. Ceritakan hasil pengamatanmu kepada guru. Jangan melihat langsung ke Matahari.</div></section>`;document.getElementById('reflectionForm').onsubmit=e=>{e.preventDefault();let vals=['r1','r2','r3'].map(id=>document.getElementById(id).value.trim());if(vals.some(v=>!v)){document.getElementById('reflectMsg').innerHTML='<div class="feedback bad">Lengkapi ketiga refleksi sebelum menyimpan.</div>';return}try{localStorage.setItem('mpiCahayaReflection',JSON.stringify(vals))}catch(e){}document.getElementById('reflectMsg').innerHTML='<div class="feedback good">Refleksi tersimpan pada sesi/peramban ini. Bagikan jawabanmu kepada guru.</div>'}}
}
function openTopic(i){topicIndex=Math.max(0,Math.min(5,i));page='topic';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='materials'));render();window.scrollTo({top:0,behavior:'smooth'})}
function markTopic(i){completed[i]=true;render()}
function openLab(i){topicIndex=i;labStep=0;labSetting=0;go('lab')}
function setLabTopic(v){topicIndex=Number(v);labStep=0;render()}
function setLabSetting(v){labSetting=Number(v);labStep=labSetting;let result=document.getElementById('labResult');if(result)result.textContent=['Amati gambar terlebih dahulu. Apa yang kamu perkirakan akan terjadi?','Bayangkan posisi atau arah diubah. Amati perubahan jalannya cahaya pada ilustrasi.','Bandingkan dengan kondisi awal. Perhatikan bahan, arah cahaya, atau ukuran bayangan.'][labSetting];let visual=document.querySelector('.visual');if(visual&&page==='lab')visual.innerHTML=svgFor(topicIndex,labStep)}
function labObserve(){const messages=[
['Cahaya dapat melewati lubang saat ketiganya segaris. Jika satu karton digeser, cahaya terhalang.','Cahaya tetap merambat lurus dalam medium seragam.'],
['Cahaya yang mengenai cermin berubah arah.','Pada cermin datar, sudut datang sama dengan sudut pantul, diukur dari garis normal.'],
['Pensil tampak bergeser pada batas air dan udara.','Cahaya dibiaskan ketika melewati dua medium berbeda.'],
['Kaca bening meneruskan cahaya dengan baik; kertas minyak meneruskan sebagian cahaya; karton menghalangi cahaya.','Bahan memiliki kemampuan meneruskan cahaya yang berbeda.'],
['Prisma dapat memisahkan cahaya putih menjadi spektrum warna.','Penguraian cahaya putih menghasilkan berbagai warna.'],
['Daerah di belakang benda yang terhalang cahaya tampak lebih gelap.','Bayangan terbentuk ketika benda menghalangi jalannya cahaya.']
];document.getElementById('labResult').textContent=messages[topicIndex][labSetting===2?1:0];document.getElementById('labFeedback').innerHTML='<div class="feedback good">Bagus! Sekarang bandingkan hasil ini dengan prediksimu.</div>'}
function labConclusion(){document.getElementById('labFeedback').innerHTML='<div class="feedback good"><b>Kesimpulan:</b> '+topics[topicIndex].explain+' Hubungkan kesimpulan ini dengan hasil pengamatanmu.</div>';completed[topicIndex]=true}
function chooseAnswer(i,j){if(quizSubmitted)return;quizAnswers[i]=j;render()}
function submitQuiz(){if(quizAnswers.some(a=>a===null)){document.getElementById('quizMsg').innerHTML='<div class="feedback bad">Masih ada soal yang belum dijawab. Lengkapi semua soal terlebih dahulu.</div>';return}quizSubmitted=true;render()}
function resetQuiz(){quizAnswers=Array(questions.length).fill(null);quizSubmitted=false;go('quiz')}
document.getElementById('soundBtn').addEventListener('click',()=>{sound=!sound;let b=document.getElementById('soundBtn');b.textContent=sound?'🔊 Suara: Aktif':'🔈 Suara: Mati';b.setAttribute('aria-pressed',String(sound));if(sound&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Halo, ilmuwan cilik. Selamat belajar sifat-sifat cahaya.');u.lang='id-ID';speechSynthesis.speak(u)}else if('speechSynthesis'in window)speechSynthesis.cancel()});
render();
</script>
</body></html>
